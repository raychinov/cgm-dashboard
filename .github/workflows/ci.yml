name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Re-render the layout snapshots on the runner and commit them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_snapshots) }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run check:playwright-image
      - run: npm test
      - run: npm run typecheck
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  snapshots:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    concurrency:
      group: snapshots-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run check:playwright-image
      - run: npx playwright test tests/e2e/layout.spec.ts --update-snapshots
      - run: npx playwright test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__snapshots__
          if git diff --cached --quiet; then
            echo "snapshots unchanged"
          else
            git commit -m "Re-render layout snapshots on the CI runner"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-snapshots
          path: test-results/
          retention-days: 7
